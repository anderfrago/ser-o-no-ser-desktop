<div class="game-setup-container">
  <h2>Game Setup</h2>

  <form [formGroup]="gameSetupForm" (ngSubmit)="onSubmit()">
    <div formArrayName="teams">
      <h3>Teams</h3>
      <div *ngFor="let team of teams.controls; let i = index" [formGroupName]="i" class="team-group">
        <h4>Team {{ i + 1 }}</h4>
        <div class="form-field">
          <label for="teamName-{{i}}">Team Name:</label>
          <input id="teamName-{{i}}" type="text" formControlName="name" placeholder="Enter team name">
          <div *ngIf="team.get('name')?.invalid && team.get('name')?.touched" class="error-message">
            Team name is required.
          </div>
        </div>
        <div class="form-field">
          <label for="teamColor-{{i}}">Team Color:</label>
          <input id="teamColor-{{i}}" type="color" formControlName="color">
        </div>
        <button type="button" (click)="removeTeam(i)" *ngIf="teams.length > 1" class="remove-button">Remove Team</button>
      </div>
      <button type="button" (click)="addTeam()" class="add-button">Add Team</button>
    </div>

    <div class="form-field game-mode-selection">
      <label for="gameMode">Game Mode:</label>
      <select id="gameMode" formControlName="mode">
        <option *ngFor="let mode of gameModes" [value]="mode">{{ mode | titlecase }}</option>
      </select>
      <div *ngIf="gameSetupForm.get('mode')?.invalid && gameSetupForm.get('mode')?.touched" class="error-message">
        Game mode is required.
      </div>
    </div>

    <button type="submit" [disabled]="gameSetupForm.invalid" class="submit-button">Start Game</button>
  </form>
</div>
