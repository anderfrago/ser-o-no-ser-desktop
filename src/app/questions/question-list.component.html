<div class="question-list-container">
  <h2>Lista de preguntas</h2>

  <div *ngIf="loading" class="loading-spinner">
    Cargando preguntas...
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <ul *ngIf="!loading && !error && questions.length > 0" class="question-items">
    <li *ngFor="let question of questions" class="question-item">
      <h3>{{ question.titulo }}</h3>
      <p>ID: {{ question.idPregunta }}</p>
      <p>Habilitado: {{ question.Habilitado ? 'Sí' : 'No' }}</p>
      <!-- Add more details as needed -->
    </li>
  </ul>

  <div *ngIf="!loading && !error && questions.length === 0" class="no-questions">
    No se han encontrado preguntas.
  </div>
</div>
